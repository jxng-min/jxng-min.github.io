# Site
title:              김종민의 기술 블로그
bio:                Unity, Cocos, Enjoy😀
description:        "Unity, Cocos, Enjoy😀"
locale:             en_US
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://github.com/jxng-min/jxng-min.github.io" # the base hostname & protocol for your site

# Comments
disqus_shortname:   default

# Social
analytics-id:       "default"
twitter:            default
facebook:           default
instagram:          https://www.instagram.com/jxng.min/
github:             jxng-min
keywords:
  - Unity
  - Cocos
  - Troubleshooting
  - Algorithm
  - Math
  - ETC
google_drive:       https://drive.google.com/drive/folders/1CVe9uwdHy753r3-Qf44ukC28ncSGqyYv?hl=ko

# personal
location:           서울특별시 동작구 상도3동
phone:              010-7596-0596
email:              vwmartin@naver.com

# Other
background_image:   /images/bg.jpg
# Tip: The color palette and other styles can be configured in /_sass/lib/_vars.scss
slapform_thankyou_page: /thank-you

defaults:
- scope:
    path: ''
    type: posts
  values:
    permalink: "/blog/:title/"
    layout: post
    author:

# Jekyll
permalink:          /blog/:title/
markdown:           kramdown
highlighter:        rouge
kramdown:
  auto_ids:         true
  footnote_nr:      1
  entity_output:    as_char
  toc_levels:       1..6
  enable_coderay:   false
mathjax:            true
sass:
  sass_dir:         _sass
  style:            compressed

# Gems
gems:
  - jekyll-mentions
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate

paginate: 6
paginate_path: "/blog/page:num/"

jekyll-mentions:
    base_url: https://github.com

# Exclude list
exclude: [README.md, Gemfile, Gemfile.lock, node_modules, gulpfile.js, package.json, _site, src, vendor, CNAME, LICENSE, Rakefile, old]
