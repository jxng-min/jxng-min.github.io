<ul class="links">
  <li class="{% if page.url == "/" or page.url contains '/blog/' %} active {% endif %}"><a href="{{ "/" | absolute_url }}">Blog</a></li>
</ul>

<div class="nav-search">
  <label for="post-search" class="visually-hidden">제목 검색</label>
  <input type="search" id="post-search" placeholder="제목 검색…" aria-label="포스트 제목 검색" />
</div>

<ul class="icons">
  <li><a href="https://github.com/{{site.github}}" class="icon icon-github" rel="nofollow" aria-label="GitHub"><span class="label">GitHub</span></a></li>
  <li><a href="{{ site.google_drive | default: 'https://drive.google.com' }}" class="icon icon-google-drive" rel="nofollow" aria-label="Google Drive"><span class="label">Google Drive</span></a></li>
  <li><a href="https://instagram.com/{{site.instagram}}" class="icon icon-instagram" rel="nofollow" aria-label="Instagram"><span class="label">Instagram</span></a></li>
</ul>
